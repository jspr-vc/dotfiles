# Build Python AUR packages with system Python, not pyenv shims.
# pyenv's 3.x shim lacks build tooling (python-build, installer, ...),
# which makes makepkg's build()/package() fail with "No module named build".
# Force system Python here so every AUR build uses /usr/bin/python.
export PYENV_VERSION=system
export PATH="/usr/local/sbin:/usr/local/bin:/usr/bin:/bin:$PATH"

# Skip -debug split packages; only useful when attaching a debugger to an AUR app.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)
