# Rendered by Caelestia into ~/.local/state/caelestia/theme/superfile.toml on
# every scheme change. config/superfile/theme/caelestia.toml links to it.

# Only used when code_previewer is not "bat"
code_syntax_highlight = "monokai"

full_screen_fg = "#{{ onSurfaceVariant.hex }}"
full_screen_bg = "#{{ background.hex }}"

gradient_color = ["#{{ primary.hex }}", "#{{ tertiary.hex }}"]

file_panel_fg = "#{{ onSurfaceVariant.hex }}"
file_panel_bg = "#{{ background.hex }}"
file_panel_border = "#{{ outlineVariant.hex }}"
file_panel_border_active = "#{{ primary.hex }}"
file_panel_top_directory_icon = "#{{ secondary.hex }}"
file_panel_top_path = "#{{ primary.hex }}"
file_panel_item_selected_fg = "#{{ onSecondaryContainer.hex }}"
file_panel_item_selected_bg = "#{{ secondaryContainer.hex }}"

footer_fg = "#{{ onSurfaceVariant.hex }}"
footer_bg = "#{{ background.hex }}"
footer_border = "#{{ outlineVariant.hex }}"
footer_border_active = "#{{ primary.hex }}"

sidebar_fg = "#{{ onSurfaceVariant.hex }}"
sidebar_bg = "#{{ background.hex }}"
sidebar_title = "#{{ tertiary.hex }}"
sidebar_border = "#{{ outlineVariant.hex }}"
sidebar_border_active = "#{{ primary.hex }}"
sidebar_item_selected_fg = "#{{ onSecondaryContainer.hex }}"
sidebar_item_selected_bg = "#{{ secondaryContainer.hex }}"
sidebar_divider = "#{{ outline.hex }}"

modal_fg = "#{{ onSurface.hex }}"
modal_bg = "#{{ surfaceContainer.hex }}"
modal_border_active = "#{{ primary.hex }}"
modal_cancel_fg = "#{{ onErrorContainer.hex }}"
modal_cancel_bg = "#{{ errorContainer.hex }}"
modal_confirm_fg = "#{{ onPrimaryContainer.hex }}"
modal_confirm_bg = "#{{ primaryContainer.hex }}"

help_menu_hotkey = "#{{ primary.hex }}"
help_menu_title = "#{{ tertiary.hex }}"

cursor = "#{{ primary.hex }}"
correct = "#{{ success.hex }}"
error = "#{{ error.hex }}"
hint = "#{{ tertiary.hex }}"
cancel = "#{{ error.hex }}"
